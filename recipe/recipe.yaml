context:
  version: 2.0.14

package:
  name: micro
  version: ${{ version }}

source:
  url: https://github.com/zyedidia/micro/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 40177579beb3846461036387b649c629395584a4bbe970f61ba7591bd9c0185a

build:
  number: 3
  dynamic_linking:
    binary_relocation: false

requirements:
  build:
    - ${{ compiler('go-cgo') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - go-licenses
    - make

tests:
  - script:
      - micro --version

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: A modern and intuitive terminal-based text editor
  homepage: https://micro-editor.github.io/
  repository: https://github.com/zyedidia/micro

extra:
  recipe-maintainers:
    - danielnachun
    - dhirschfeld
